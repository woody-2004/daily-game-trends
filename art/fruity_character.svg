<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFD1DC"/>
    </radialGradient>
    <radialGradient id="berry" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FF6B7A"/><stop offset="0.7" stop-color="#E8243B"/><stop offset="1" stop-color="#A5122A"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2E9E44"/><stop offset="1" stop-color="#8BE36A"/>
    </linearGradient>
    <radialGradient id="orange" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="0.85" stop-color="#FFA726"/><stop offset="1" stop-color="#F57C00"/>
    </radialGradient>
    <linearGradient id="banana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF176"/><stop offset="1" stop-color="#FBC02D"/>
    </linearGradient>
    <radialGradient id="grape" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#B388FF"/><stop offset="1" stop-color="#5E2CA5"/>
    </radialGradient>
    <pattern id="seeds" width="34" height="38" patternUnits="userSpaceOnUse">
      <ellipse cx="9" cy="10" rx="3" ry="5" fill="#FFE27A" transform="rotate(-15 9 10)"/>
      <ellipse cx="26" cy="29" rx="3" ry="5" fill="#FFE27A" transform="rotate(15 26 29)"/>
    </pattern>
  </defs>

  <rect width="512" height="640" fill="url(#bg)"/>
  <!-- floating fruit confetti -->
  <g opacity="0.85">
    <circle cx="60" cy="90" r="14" fill="#8BC34A"/><circle cx="60" cy="90" r="9" fill="#DCEDC8"/>
    <circle cx="455" cy="120" r="12" fill="url(#grape)"/><circle cx="470" cy="138" r="12" fill="url(#grape)"/>
    <path d="M430 520 q20 -30 45 -10" stroke="#FBC02D" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="540" r="10" fill="#E8243B"/><circle cx="68" cy="548" r="10" fill="#E8243B"/>
    <path d="M50 530 q8 -20 18 -30 M68 538 q-2 -18 0 -38" stroke="#2E9E44" stroke-width="3" fill="none"/>
  </g>

  <!-- shadow -->
  <ellipse cx="256" cy="600" rx="130" ry="18" fill="#000" opacity="0.12"/>

  <!-- legs: banana boots -->
  <path d="M205 520 L200 575" stroke="#2E9E44" stroke-width="14" stroke-linecap="round"/>
  <path d="M307 520 L312 575" stroke="#2E9E44" stroke-width="14" stroke-linecap="round"/>
  <path d="M160 585 q35 -30 70 -10 q5 15 -10 18 q-30 2 -60 -8z" fill="url(#banana)" stroke="#C49000" stroke-width="3"/>
  <path d="M352 585 q-35 -30 -70 -10 q-5 15 10 18 q30 2 60 -8z" fill="url(#banana)" stroke="#C49000" stroke-width="3"/>

  <!-- arms -->
  <path d="M130 360 q-50 20 -60 -30" stroke="#2E9E44" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M382 360 q55 10 60 50" stroke="#2E9E44" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- left hand waving, right holds grape bunch -->
  <circle cx="70" cy="325" r="18" fill="#8BE36A" stroke="#2E9E44" stroke-width="4"/>
  <g>
    <path d="M442 405 q0 -18 10 -26" stroke="#6D4C41" stroke-width="4" fill="none"/>
    <circle cx="430" cy="420" r="13" fill="url(#grape)"/><circle cx="455" cy="420" r="13" fill="url(#grape)"/>
    <circle cx="442" cy="440" r="13" fill="url(#grape)"/><circle cx="420" cy="442" r="12" fill="url(#grape)"/>
    <circle cx="465" cy="442" r="12" fill="url(#grape)"/><circle cx="442" cy="462" r="12" fill="url(#grape)"/>
    <circle cx="442" cy="412" r="15" fill="#8BE36A" stroke="#2E9E44" stroke-width="4"/>
  </g>

  <!-- strawberry body -->
  <path id="body" d="M256 560 C150 540 105 400 118 300 C128 215 190 185 256 185 C322 185 384 215 394 300 C407 400 362 540 256 560Z" fill="url(#berry)" stroke="#8E0E22" stroke-width="5"/>
  <path d="M256 560 C150 540 105 400 118 300 C128 215 190 185 256 185 C322 185 384 215 394 300 C407 400 362 540 256 560Z" fill="url(#seeds)" opacity="0.9"/>
  <ellipse cx="190" cy="265" rx="28" ry="45" fill="#fff" opacity="0.18" transform="rotate(25 190 265)"/>

  <!-- pineapple-leaf hair crown -->
  <g stroke="#1E7A34" stroke-width="3" fill="url(#leaf)">
    <path d="M256 200 C240 140 250 90 256 50 C262 90 272 140 256 200Z"/>
    <path d="M250 205 C200 160 185 120 190 80 C215 115 240 150 250 205Z"/>
    <path d="M262 205 C312 160 327 120 322 80 C297 115 272 150 262 205Z"/>
    <path d="M240 210 C180 190 150 160 140 130 C185 145 215 170 240 210Z"/>
    <path d="M272 210 C332 190 362 160 372 130 C327 145 297 170 272 210Z"/>
    <path d="M225 215 C175 215 140 205 120 190 C165 185 200 195 225 215Z"/>
    <path d="M287 215 C337 215 372 205 392 190 C347 185 312 195 287 215Z"/>
  </g>

  <!-- face -->
  <!-- kiwi-slice eyes -->
  <g>
    <circle cx="210" cy="330" r="36" fill="#7CB342" stroke="#5D4037" stroke-width="4"/>
    <circle cx="210" cy="330" r="28" fill="#C5E1A5"/>
    <circle cx="302" cy="330" r="36" fill="#7CB342" stroke="#5D4037" stroke-width="4"/>
    <circle cx="302" cy="330" r="28" fill="#C5E1A5"/>
    <circle cx="214" cy="334" r="16" fill="#1B1B2F"/><circle cx="306" cy="334" r="16" fill="#1B1B2F"/>
    <circle cx="220" cy="327" r="6" fill="#fff"/><circle cx="312" cy="327" r="6" fill="#fff"/>
    <circle cx="208" cy="342" r="3" fill="#fff"/><circle cx="300" cy="342" r="3" fill="#fff"/>
  </g>
  <!-- brows -->
  <path d="M182 285 q28 -16 56 -2" stroke="#5D1020" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M274 283 q28 -14 56 2" stroke="#5D1020" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- orange-slice blush cheeks -->
  <g opacity="0.95">
    <circle cx="160" cy="395" r="22" fill="url(#orange)"/>
    <circle cx="352" cy="395" r="22" fill="url(#orange)"/>
    <g stroke="#FFF3D0" stroke-width="2">
      <path d="M160 373 V417 M138 395 H182 M144 379 L176 411 M176 379 L144 411"/>
      <path d="M352 373 V417 M330 395 H374 M336 379 L368 411 M368 379 L336 411"/>
    </g>
  </g>
  <!-- watermelon-slice smile -->
  <path d="M206 392 Q256 470 306 392 Z" fill="#FF4D6D" stroke="#2E7D32" stroke-width="7" stroke-linejoin="round"/>
  <path d="M212 396 Q256 462 300 396" fill="none" stroke="#C8E6C9" stroke-width="3"/>
  <ellipse cx="240" cy="415" rx="3" ry="5" fill="#1B1B2F"/>
  <ellipse cx="258" cy="428" rx="3" ry="5" fill="#1B1B2F"/>
  <ellipse cx="276" cy="414" rx="3" ry="5" fill="#1B1B2F"/>

  <!-- banana belt -->
  <path d="M150 470 Q256 505 362 470" stroke="url(#banana)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M150 470 Q256 505 362 470" stroke="#C49000" stroke-width="2" fill="none" stroke-dasharray="4 14"/>
  <!-- cherry buckle -->
  <path d="M248 488 q6 -26 20 -34 M264 488 q-2 -22 4 -34" stroke="#2E7D32" stroke-width="3" fill="none"/>
  <circle cx="248" cy="494" r="11" fill="#C2185B" stroke="#7B0E3A" stroke-width="2"/>
  <circle cx="266" cy="494" r="11" fill="#C2185B" stroke="#7B0E3A" stroke-width="2"/>
  <circle cx="245" cy="490" r="3" fill="#fff" opacity="0.7"/><circle cx="263" cy="490" r="3" fill="#fff" opacity="0.7"/>

</svg>
